{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-bg d-flex align-items-center py-5" style="min-height: 85vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card eco-card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="eco-icon-circle mx-auto mb-3">
                                <i class="bi bi-person-plus-fill fs-2 text-white"></i>
                            </div>
                            <h2 class="fw-bold mb-1">Create Account</h2>
                            <p class="text-muted small">Join EcoShop and shop sustainably</p>
                        </div>

                        <form method="POST" action="{{ url_for('signup') }}">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-medium">Full Name</label>
                                    <div class="input-group eco-input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" name="name" placeholder="Jane Doe"
                                            required>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-medium">Email</label>
                                    <div class="input-group eco-input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" name="email"
                                            placeholder="you@example.com" required>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-medium">Password</label>
                                    <div class="input-group eco-input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" name="password"
                                            placeholder="Min 6 characters" minlength="6" required>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-medium">Phone <span
                                            class="text-muted fw-normal">(optional)</span></label>
                                    <div class="input-group eco-input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="tel" class="form-control" name="phone" placeholder="9876543210">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-medium">Address <span
                                            class="text-muted fw-normal">(optional)</span></label>
                                    <div class="input-group eco-input-group">
                                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                        <textarea class="form-control" name="address" rows="2"
                                            placeholder="Your delivery address"></textarea>
                                    </div>
                                </div>
                                <div class="col-12 mt-2">
                                    <button type="submit" class="btn btn-eco w-100 py-2 fw-semibold">
                                        <i class="bi bi-person-check me-2"></i>Create My Account
                                    </button>
                                </div>
                            </div>
                        </form>

                        <hr class="my-4">
                        <p class="text-center text-muted small mb-0">
                            Already have an account?
                            <a href="{{ url_for('login') }}" class="eco-link fw-semibold">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
