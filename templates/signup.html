{% extends 'base.html' %}

{% block title %}Sign Up | Vmart Supermart{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card border-0 shadow-lg rounded-4 p-4 w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="vmart-icon-circle mx-auto mb-3 shadow-sm">
                <i class="bi bi-person-plus-fill text-warning"></i>
            </div>
            <h3 class="fw-extrabold text-dark mb-1">Create Vmart Account</h3>
            <p class="text-muted small mb-0">Join Vmart & get instant $5.00 Welcome Discount</p>
        </div>

        <form method="POST" action="{{ url_for('signup') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" name="name" class="form-control border-start-0" placeholder="Jane Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="jane@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-vmart btn-lg w-100 py-3 mb-3 shadow">
                <i class="bi bi-check-circle-fill me-2"></i>Sign Up & Start Saving
            </button>
        </form>

        <div class="text-center small mt-3">
            Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-danger">Login</a>
        </div>
    </div>
</div>
{% endblock %}
