{% extends 'base.html' %}

{% block title %}Add Product | Vmart Supermart{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 650px;">
    <div class="card border-0 shadow-lg rounded-4 p-4">
        <h3 class="fw-bold text-dark border-bottom pb-3 mb-4"><i class="bi bi-plus-circle-fill text-danger me-2"></i>Add Supermarket Product</h3>

        <form method="POST" action="{{ url_for('add_product') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Product Name</label>
                <input type="text" name="name" class="form-control form-control-lg" placeholder="e.g. Organic Almond Milk (1L)" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea name="description" class="form-control" rows="2" placeholder="Brief product description..."></textarea>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Category</label>
                    <select name="category_id" class="form-select form-select-lg" required>
                        {% for cat in categories %}
                        <option value="{{ cat.category_id }}">{{ cat.category_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Deal Tag</label>
                    <select name="deal_tag" class="form-select form-select-lg">
                        <option value="Hot Deal">Hot Deal</option>
                        <option value="Best Seller">Best Seller</option>
                        <option value="20% OFF">20% OFF</option>
                        <option value="25% OFF">25% OFF</option>
                        <option value="BOGO">BOGO (Buy 1 Get 1)</option>
                        <option value="Super Saver">Super Saver</option>
                        <option value="Fresh">Fresh</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">MRP ($)</label>
                    <input type="number" step="0.01" name="mrp" class="form-control form-control-lg" placeholder="5.99" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Sale Price ($)</label>
                    <input type="number" step="0.01" name="price" class="form-control form-control-lg" placeholder="4.49" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Stock Qty</label>
                    <input type="number" name="stock" value="100" class="form-control form-control-lg" required>
                </div>
            </div>

            <div class="d-flex gap-3">
                <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary btn-lg w-50">Cancel</a>
                <button type="submit" class="btn btn-vmart btn-lg w-50 shadow">Add Product</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
