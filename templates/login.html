{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-bg d-flex align-items-center" style="min-height: 85vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card eco-card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="eco-icon-circle mx-auto mb-3">
                                <i class="bi bi-leaf-fill fs-2 text-white"></i>
                            </div>
                            <h2 class="fw-bold mb-1">Welcome Back</h2>
                            <p class="text-muted small">Login to track your carbon footprint</p>
                        </div>

                        <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-medium">Email address</label>
                                <div class="input-group eco-input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="you@example.com" required autocomplete="email">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-medium">Password</label>
                                <div class="input-group eco-input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password"
                                        placeholder="Enter your password" required autocomplete="current-password">
                                    <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                                        <i class="bi bi-eye" id="eyeIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-eco w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </form>

                        <hr class="my-4">
                        <p class="text-center text-muted small mb-0">
                            Don't have an account?
                            <a href="{{ url_for('signup') }}" class="eco-link fw-semibold">Sign up free</a>
                        </p>

                        <div class="mt-3 p-3 bg-light rounded-3 small">
                            <p class="mb-1 fw-semibold text-muted">Demo accounts:</p>
                            <p class="mb-0 text-muted"><i
                                    class="bi bi-person-fill-gear me-1 text-warning"></i>admin@eco.com / admin123</p>
                            <p class="mb-0 text-muted"><i class="bi bi-person me-1 text-success"></i>jane@eco.com /
                                user123</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById("togglePwd").addEventListener("click", function () {
        const pwd = document.getElementById("password");
        const icon = document.getElementById("eyeIcon");
        if (pwd.type === "password") {
            pwd.type = "text";
            icon.className = "bi bi-eye-slash";
        } else {
            pwd.type = "password";
            icon.className = "bi bi-eye";
        }
    });
</script>
{% endblock %}
