{% extends 'base.html' %}

{% block title %}Login | Vmart Supermart{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card border-0 shadow-lg rounded-4 p-4 w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="vmart-icon-circle mx-auto mb-3 shadow-sm">
                <i class="bi bi-cart-fill text-warning"></i>
            </div>
            <h3 class="fw-extrabold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small mb-0">Sign in to your Vmart Supermart account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="jane@vmart.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-vmart btn-lg w-100 py-3 mb-3 shadow">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login to Vmart
            </button>
        </form>

        <div class="text-center small text-muted border-top pt-3">
            Demo Accounts:<br>
            <strong>User:</strong> jane@vmart.com / <code>user123</code><br>
            <strong>Admin:</strong> admin@vmart.com / <code>admin123</code>
        </div>

        <div class="text-center small mt-3">
            Don't have an account? <a href="{{ url_for('signup') }}" class="fw-bold text-danger">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
